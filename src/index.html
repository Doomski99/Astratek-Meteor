<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gui-container" class="control-panel">
        <button id="forceCollisionButton" class="control-panel__button" type="button" disabled>Force Collision Course</button>
    </div>
    <aside id="asteroidListPanel" class="asteroid-panel">
        <header class="asteroid-panel__header">Tracked Asteroids</header>
        <ul id="asteroidList" class="asteroid-panel__list"></ul>
    </aside>
    <aside id="viewTargetPanel" class="view-panel">
        <header class="view-panel__header">View Targets</header>
        <ul id="viewTargetList" class="view-panel__list">
            <li class="view-panel__item view-panel__item--active" data-target-id="earth">Earth (Default)</li>
        </ul>
    </aside>
    <div id="impactLegendOverlay" class="impact-legend">
        <h3 class="impact-legend__title">Impact Yield Bands</h3>
        <ul class="impact-legend__scale">
            <li data-yield="low"><span class="impact-legend__swatch impact-legend__swatch--low"></span><span>&lt;= 1 Mt</span></li>
            <li data-yield="medium"><span class="impact-legend__swatch impact-legend__swatch--medium"></span><span>1 - 10 Mt</span></li>
            <li data-yield="high"><span class="impact-legend__swatch impact-legend__swatch--high"></span><span>&gt; 10 Mt</span></li>
        </ul>
    </div>
    <aside id="asteroidInfoPanel" class="asteroid-info">
        <div class="asteroid-info__header">
            <span class="asteroid-info__title">Asteroid Details</span>
            <span class="asteroid-info__name" data-asteroid-name>No asteroid selected</span>
        </div>
        <p class="asteroid-info__placeholder" data-asteroid-placeholder>Select a tracked asteroid to see telemetry.</p>
        <div class="asteroid-info__sections" data-asteroid-sections hidden>
            <section class="asteroid-info__section" data-section="velocity">
                <h4 class="asteroid-info__section-title">Velocity</h4>
                <div class="asteroid-info__stat">
                    <span class="asteroid-info__label">Speed</span>
                    <span class="asteroid-info__value" data-velocity-speed>—</span>
                </div>
                <div class="asteroid-info__vector">
                    <span>X: <span data-velocity-x>—</span></span>
                    <span>Y: <span data-velocity-y>—</span></span>
                    <span>Z: <span data-velocity-z>—</span></span>
                </div>
            </section>
        </div>
    </aside>
    <div id="planetInfo" class="planet-info">
        <div class="planet-info-content">
            <span class="close-btn" onclick="closeInfo()">&times;</span>
            <h2 id="planetName"></h2>
            <p id="planetDetails"></p>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
